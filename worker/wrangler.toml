name = "bill-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Live D1 database id for the `bill` database.
[[d1_databases]]
binding = "DB"
database_name = "bill"
database_id = "6333cb0a-0c23-44b2-9022-a6fde1500f77"
migrations_dir = "migrations"

[vars]
PUBLIC_BASE_URL = "https://usebill.dev"
THRONE_TEST_GIFTER_USERNAMES = ""
NOTIFICATION_MAX_ATTEMPTS = "5"
NOTIFICATION_BACKOFF_BASE_SECONDS = "30"
NOTIFICATION_BACKOFF_MAX_SECONDS = "900"
MAX_TIMESTAMP_SKEW_SECONDS = "300"

# Required deployment values (set with `wrangler secret put`, never committed):
#   BILL_BOT_API_TOKEN
#   BILL_HOME_GUILD_ID
#   THRONE_PUBLIC_KEY_PEM
